
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mes projets</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <h1>Mes projets</h1>

    {{range .}}
        <h2>{{.Titre}}</h2>

        <img src="{{.Image}}" width="400" alt="{{.Titre}}">

        <p>{{.Introduction}}</p>

        <h3>Technologies</h3>

        <ul>
            {{range .Technologies}}
                <li>{{.}}</li>
            {{end}}
        </ul>

        <a href="/projects/{{.ID}}">Consulter</a>
    {{end}}

    <p><a href="/">Retour à l'accueil</a></p>

</body>
</html>
