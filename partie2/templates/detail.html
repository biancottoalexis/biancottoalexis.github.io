
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{.Titre}}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <h1>{{.Titre}}</h1>

    <img src="{{.Image}}" alt="{{.Titre}}" width="400">

    <p>{{.Introduction}}</p>

    <h2>Description</h2>
    <p>{{.Description}}</p>

    <h2>Technologies</h2>
    <ul>
        {{range .Technologies}}
        <li>{{.}}</li>
        {{end}}
    </ul>

    <h2>Fonctionnalités</h2>
    <ul>
        {{range .Fonctionnalites}}
        <li>{{.}}</li>
        {{end}}
    </ul>

    {{if .Depot}}
    <a href="{{.Depot}}">Voir le dépôt GitHub</a>
    {{end}}

    {{if .Video}}
    <a href="{{.Video}}">Voir la vidéo</a>
    {{end}}

    <p><a href="/projects">Retour aux projets</a></p>

</body>
</html>
